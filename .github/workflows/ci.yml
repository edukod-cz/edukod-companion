name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23.x"
          cache-dependency-path: go.mod

      - name: Run tests, formatting check, and vet
        run: make check

      - name: Run race detector
        run: go test -race ./...

      - name: Build release packages
        run: make dist VERSION=0.0.0-ci

      - name: Inspect package metadata
        run: |
          set -euo pipefail
          dpkg-deb --info dist/edukod-companion_0.0.0-ci_linux_amd64.deb
          dpkg-deb --contents dist/edukod-companion_0.0.0-ci_linux_amd64.deb
