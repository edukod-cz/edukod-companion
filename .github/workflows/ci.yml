name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.23.x"
          cache-dependency-path: go.mod

      - name: Run tests, formatting check, and vet
        run: make check

      - name: Run race detector
        run: go test -race ./...

      - name: Build release packages
        run: make dist VERSION=0.0.0-ci

      - name: Inspect package metadata
        run: |
          set -euo pipefail
          dpkg-deb --info dist/edukod-companion_0.0.0-ci_linux_amd64.deb
          dpkg-deb --contents dist/edukod-companion_0.0.0-ci_linux_amd64.deb
